<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikSepet | Ödeme</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico" />
  </head>
  <body>
    <div id="loader">Yükleniyor...</div>

    <!-- Navbar -->
    <header>
      <nav class="navbar">
        <!-- Logo -->
        <a href="index.html" class="logo">
          <img
            src="assets/images/logos/logo_light.png"
            alt="TikSepet"
            id="site-logo"
          />
        </a>

        <!-- Orta Menü -->
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html">Anasayfa</a></li>
          <li><a href="products.html">Ürünler</a></li>
          <li>
            <a href="cart.html">
              🛒 Sepet <span id="cart-count" class="cart-count">0</span>
            </a>
          </li>
        </ul>

        <!-- Sağ Taraf -->
        <div class="nav-right">
          <!-- Tema butonu -->
          <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            title="Tema"
          >
            🌓
          </button>

          <!-- Hesap menüsü -->
          <div class="account-menu" id="accountMenu">
            <a href="login.html" id="loginLink">Giriş Yap</a>
            <a href="register.html" id="registerLink">Kayıt Ol</a>
            <!-- Kullanıcı giriş yaptıysa şu görünecek -->
            <div id="userDropdown" class="dropdown hidden">
              <button class="dropbtn">👤 Hesabım ▾</button>
              <div class="dropdown-content">
                <a href="profile.html">Profil</a>
                <a href="orders.html">Siparişlerim</a>
                <a href="#" id="logoutBtn">Çıkış Yap</a>
              </div>
            </div>
          </div>

          <!-- Hamburger -->
          <div
            id="hamburger"
            class="nav-toggle"
            role="button"
            tabindex="0"
            aria-label="Menüyü aç/kapat"
          >
            <span></span><span></span><span></span>
          </div>
        </div>
      </nav>
    </header>

    <!-- Ödeme Formu -->
    <main class="checkout-container">
      <h1>Ödeme Sayfası</h1>
      <form id="checkout-form" novalidate>
        <h2>Teslimat Bilgileri</h2>

        <label>Ad *</label>
        <input type="text" id="first-name" required />
        <label>Soyad *</label>
        <input type="text" id="last-name" required />
        <label>Telefon *</label>
        <input
          type="tel"
          id="phone"
          required
          placeholder="0534 896 84 32"
          inputmode="numeric"
        />
        <label>E-posta *</label>
        <input type="email" id="email" required />
        <label>İl *</label>
        <input type="text" id="city" required />
        <label>İlçe *</label>
        <input type="text" id="district" required />
        <label>Açık Adres *</label>
        <textarea id="address" rows="3" required></textarea>

        <label for="payment-method">Ödeme Yöntemi *</label>
        <select id="payment-method" required>
          <option value="">Seçiniz</option>
          <option value="card">Kart ile Ödeme</option>
          <option value="cash">Kapıda Ödeme</option>
        </select>

        <div id="card-info" style="display: none; margin-top: 15px">
          <h3>Kart Bilgileri</h3>
          <label>Kart Numarası *</label>
          <input
            type="text"
            id="card-number"
            maxlength="19"
            placeholder="XXXX XXXX XXXX XXXX"
            inputmode="numeric"
          />
          <label>Son Kullanma Tarihi *</label>
          <input
            type="text"
            id="expiry"
            placeholder="AA/YY"
            inputmode="numeric"
          />
          <label>CVV *</label>
          <input type="text" id="cvv" maxlength="4" inputmode="numeric" />
        </div>

        <button type="submit" class="complete-order-btn">
          Siparişi Tamamla
        </button>
      </form>
    </main>

    <!-- Sipariş Özeti -->
    <section id="order-summary" class="order-summary" aria-live="polite">
      <h2>Sipariş Özeti</h2>
      <div id="summary-list"></div>
      <div class="summary-total">
        <span>Toplam:</span> <strong id="summary-total">₺0,00</strong>
      </div>
    </section>

    <!-- Footer -->
    <footer>
      <div class="footer-content">
        <img
          src="assets/images/logos/logo_light.png"
          alt="TikSepet Logo"
          id="footer-logo"
          class="footer-logo"
        />
        <p>&copy; 2025 TikSepet E-Ticaret Sitesi created by Hakan Onay</p>
      </div>
    </footer>

    <!-- Script sırası: global -> sayfa -->
    <script src="js/main.js"></script>
    <script src="js/checkout.js"></script>
  </body>
</html>
