<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikSepet | Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="admin">
    <!-- Navbar -->
    <header>
      <nav class="navbar">
        <a href="index.html" class="logo">
          <img
            src="assets/images/logos/logo_light.png"
            alt="TikSepet"
            id="site-logo"
          />
        </a>
        <div class="nav-right">
          <button id="theme-toggle" class="btn ghost" title="Tema">Tema</button>
          <span id="nav-username" class="muted"></span>
          <button id="logout-btn" class="btn ghost">Çıkış</button>
        </div>
      </nav>
    </header>

    <main class="admin-wrap">
      <h1>Admin Panel</h1>
      <p class="muted">Sadece admin kullanıcılar erişebilir.</p>

      <div id="admin-guard" class="card hidden">
        <strong>Erişim reddedildi.</strong> Admin değilsin.
        <a href="index.html">Ana sayfa</a>
      </div>

      <div id="admin-content" class="card hidden">
        <div class="toolbar">
          <button id="open-products-modal" class="btn primary">
            Ürün Yönetimini Aç
          </button>
          <button id="open-orders-modal" class="btn">
            Sipariş Yönetimini Aç
          </button>
        </div>
      </div>
    </main>

    <!-- ÜRÜN MODALI -->
    <div id="products-modal" class="modal-backdrop" aria-hidden="true">
      <div class="modal-content">
        <div class="modal-header-bar">
          <h2>Ürün Yönetimi</h2>
          <div style="display: flex; gap: 8px; align-items: center">
            <button id="btn-close-products" class="btn icon" title="Kapat">
              ✕
            </button>
          </div>
        </div>
        <div class="modal-body">
          <div class="toolbar">
            <button id="btn-new-product" class="btn primary">Yeni Ürün</button>
            <input
              id="search-input"
              type="text"
              placeholder="Ürün ara (başlık)"
            />
            <select id="category-filter">
              <option value="">Kategori (hepsi)</option>
            </select>
            <button id="btn-refresh-products" class="btn ghost">Yenile</button>
          </div>
          <div class="table-wrap">
            <table id="products-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Başlık</th>
                  <th>Kategori</th>
                  <th class="right">Fiyat</th>
                  <th>Stok</th>
                  <th>Rating</th>
                  <th class="right">İşlemler</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
            <p id="products-empty" class="muted hidden">Hiç ürün bulunamadı.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- SİPARİŞ MODALI -->
    <div id="orders-modal" class="modal-backdrop" aria-hidden="true">
      <div class="modal-content">
        <div class="modal-header-bar">
          <h2>Sipariş Yönetimi</h2>
          <div style="display: flex; gap: 8px; align-items: center">
            <button id="btn-close-orders" class="btn icon" title="Kapat">
              ✕
            </button>
          </div>
        </div>
        <div class="modal-body">
          <div class="toolbar">
            <input
              id="orders-search"
              type="text"
              placeholder="Ara: #id, e‑posta, ad, telefon, adres..."
            />
            <select id="status-filter">
              <option value="">Durum (hepsi)</option>
              <option value="pending">Bekliyor</option>
              <option value="paid">Ödendi</option>
              <option value="shipped">Kargoda</option>
              <option value="delivered">Teslim</option>
              <option value="cancelled">İptal</option>
            </select>
            <button id="btn-refresh-orders" class="btn ghost">Yenile</button>
          </div>
          <div class="table-wrap">
            <table id="orders-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Kullanıcı</th>
                  <th>Tutar</th>
                  <th>Adres</th>
                  <th>Durum</th>
                  <th>Tarih</th>
                  <th class="right">İşlem</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
            <p id="orders-empty" class="muted hidden">Sipariş yok.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ÜRÜN OLUŞTUR/EDİT MODALI (İKİNCİ DÜZEY) -->
    <div id="product-form-modal" class="modal-backdrop" aria-hidden="true">
      <div class="modal-content" style="width: min(720px, 92vw)">
        <div class="modal-header-bar">
          <h3 id="modal-title">Yeni Ürün</h3>
          <button id="btn-close-product-form" class="btn icon" title="Kapat">
            ✕
          </button>
        </div>
        <div class="modal-body">
          <form class="modal-form">
            <label>Başlık</label>
            <input id="p-title" type="text" />

            <label>Kategori</label>
            <input id="p-category" type="text" />

            <label>Fiyat (₺)</label>
            <input id="p-price" type="number" step="0.01" />

            <label>Stok</label>
            <input id="p-stock" type="number" />

            <label>Rating (0-5)</label>
            <input id="p-rating" type="number" step="0.1" min="0" max="5" />

            <label>Resim Dosyası</label>
            <input id="p-image-file" type="file" accept="image/*" />

            <label>Resim URL</label>
            <input id="p-image" type="text" placeholder="https://..." />

            <label>Açıklama</label>
            <textarea id="p-desc"></textarea>

            <div
              class="modal-actions"
              style="
                display: flex;
                gap: 8px;
                justify-content: flex-end;
                margin-top: 12px;
              "
            >
              <button
                type="button"
                id="btn-cancel"
                class="btn ghost btn-cancel"
              >
                Vazgeç
              </button>
              <button type="button" id="btn-save" class="btn primary btn-save">
                Kaydet
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script type="module" src="js/admin.js"></script>
  </body>
</html>
