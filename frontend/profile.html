<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikSepet | Profilim</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico" />
  </head>
  <body>
    <!-- Loader -->
    <div id="loader">Yükleniyor...</div>

    <!-- Navbar -->
    <header>
      <nav class="navbar">
        <!-- Logo -->
        <a href="index.html" class="logo">
          <img
            src="assets/images/logos/logo_light.png"
            alt="TikSepet"
            id="site-logo"
          />
        </a>

        <!-- Orta Menü -->
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html">Anasayfa</a></li>
          <li><a href="products.html">Ürünler</a></li>
          <li>
            <a href="cart.html">
              🛒 Sepet <span id="cart-count" class="cart-count">0</span>
            </a>
          </li>
        </ul>

        <!-- Sağ Menü -->
        <div class="nav-right">
          <!-- Tema butonu -->
          <button id="theme-toggle" class="theme-toggle" type="button">
            🌓
          </button>

          <!-- Hesap menüsü -->
          <div class="account-menu" id="accountMenu">
            <!-- Kullanıcı giriş yapmadıysa -->
            <a href="login.html" id="loginLink">Giriş Yap</a>
            <a href="register.html" id="registerLink">Kayıt Ol</a>

            <!-- Kullanıcı giriş yaptıysa -->
            <div id="userDropdown" class="dropdown hidden">
              <button class="dropbtn">👤 Hesabım ▾</button>
              <div class="dropdown-content">
                <a href="profile.html">Profil</a>
                <a href="admin.html" id="adminLink" class="hidden">Admin</a>
                <a href="#" id="logoutBtn">Çıkış Yap</a>
              </div>
            </div>
          </div>

          <!-- Hamburger -->
          <div
            id="hamburger"
            class="nav-toggle"
            role="button"
            tabindex="0"
            aria-label="Menüyü aç/kapat"
          >
            <span></span><span></span><span></span>
          </div>
        </div>
      </nav>
    </header>

    <!-- Profil -->
    <main class="profile-container">
      <div class="profile-header">
        <h1>Profilim</h1>
        <div class="profile-actions">
          <button class="change-pass-btn" id="change-pass-btn">
            Şifre Değiştir
          </button>
          <button class="logout-btn" id="logout-btn">Çıkış Yap</button>
        </div>
      </div>

      <section class="profile-card" aria-live="polite">
        <div class="profile-line">
          <strong>Ad Soyad:</strong> <span id="u-name">—</span>
        </div>
        <div class="profile-line">
          <strong>E-posta:</strong> <span id="u-email">—</span>
        </div>
      </section>

      <section class="orders">
        <h2>Sipariş Geçmişim</h2>
        <div id="order-list" class="order-list"></div>
        <div id="orders-empty" class="empty-state" style="display: none">
          Henüz siparişiniz yok. <a href="products.html">Alışverişe başla</a> ✨
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer>
      <div class="footer-content">
        <img
          src="assets/images/logos/logo_light.png"
          alt="TikSepet Logo"
          id="footer-logo"
          class="footer-logo"
        />
        <p>&copy; 2025 TikSepet E-Ticaret Sitesi created by Hakan Onay</p>
      </div>
    </footer>

    <!-- Şifre Değiştir Modal -->
    <div
      id="change-pass-modal"
      class="modal hidden"
      aria-hidden="true"
      role="dialog"
      aria-labelledby="change-pass-title"
    >
      <div class="modal-content">
        <h3 style="text-align: center;" id="change-pass-title">Şifre Değiştir</h3>

        <form id="change-pass-form">
          <label>
            Mevcut Şifre
            <input
              type="password"
              id="current-password"
              name="current_password"
              required
              minlength="6"
            />
          </label>

          <label>
            Yeni Şifre
            <input
              type="password"
              id="new-password"
              name="new_password"
              required
              minlength="6"
            />
          </label>

          <label>
            Yeni Şifre (Tekrar)
            <input
              type="password"
              id="new-password2"
              name="new_password2"
              required
              minlength="6"
            />
          </label>

          <div class="modal-actions">
            <button type="button" id="cancel-change-pass">Vazgeç</button>
            <button type="submit" class="primary">Güncelle</button>
          </div>

          <p class="form-hint">Şifre en az 6 karakter olmalı.</p>
          <p
            id="change-pass-error"
            class="form-error"
            style="display: none"
          ></p>
          <p
            id="change-pass-success"
            class="form-success"
            style="display: none"
          ></p>
        </form>
      </div>
      <div class="modal-backdrop"></div>
    </div>

    <!-- Scriptler -->
    <script src="js/main.js"></script>
    <script type="module" src="js/profile.js"></script>
  </body>
</html>
