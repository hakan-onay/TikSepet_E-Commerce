<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikSepet | Ürünler</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico" />
  </head>
  <body>
    <!-- Loader -->
    <div id="loader">Yükleniyor...</div>

    <!-- Navbar -->
    <header>
      <nav class="navbar">
        <!-- Logo -->
        <a href="index.html" class="logo">
          <img
            src="assets/images/logos/logo_light.png"
            alt="TikSepet"
            id="site-logo"
          />
        </a>

        <!-- Orta Menü -->
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html">Anasayfa</a></li>
          <li><a href="products.html" class="active">Ürünler</a></li>
          <li>
            <a href="cart.html">
              🛒 Sepet <span id="cart-count" class="cart-count">0</span>
            </a>
          </li>
        </ul>

        <!-- Sağ Menü -->
        <div class="nav-right">
          <!-- Tema butonu -->
          <button id="theme-toggle" class="theme-toggle" title="Tema">
            🌓
          </button>

          <!-- Hesap menüsü -->
          <div class="account-menu" id="accountMenu">
            <!-- Kullanıcı giriş yapmadıysa -->
            <a href="login.html" id="loginLink">Giriş Yap</a>
            <a href="register.html" id="registerLink">Kayıt Ol</a>

            <!-- Kullanıcı giriş yaptıysa -->
            <div id="userDropdown" class="dropdown hidden">
              <button class="dropbtn">👤 Hesabım ▾</button>
              <div class="dropdown-content">
                <a href="profile.html">Profil</a>
                <a href="admin.html" id="adminLink" class="hidden">Admin</a>
                <a href="#" id="logoutBtn">Çıkış Yap</a>
              </div>
            </div>
          </div>

          <!-- Hamburger -->
          <div
            id="hamburger"
            class="nav-toggle"
            role="button"
            tabindex="0"
            aria-label="Menüyü aç/kapat"
          >
            <span></span><span></span><span></span>
          </div>
        </div>
      </nav>
    </header>

    <!-- Ürünler -->
    <main>
      <section class="product-list">
        <h1>Ürünler</h1>

        <!-- Filtre -->
        <div class="filter-bar">
          <!-- Arama kutusu -->
          <input type="text" placeholder="Ürün ara..." class="search-input" />

          <!-- Kategori seçici -->
          <select id="category-filter" class="category-filter">
            <option value="">Tüm Kategoriler</option>
            <!-- Kategoriler dinamik olarak eklenecek -->
          </select>

          <!-- Fiyata göre sıralama -->
          <select id="sort-select" class="sort-select" title="Sırala">
            <option value="default">Sıralama: Varsayılan</option>
            <option value="price-asc">Fiyat: Artan</option>
            <option value="price-desc">Fiyat: Azalan</option>
            <option value="rating-desc">Puan: Yüksekten Düşüğe</option>
            <option value="rating-asc">Puan: Düşükten Yükseğe</option>
          </select>
        </div>

        <!-- Ürün Grid (dinamik örnekler) -->
        <div class="product-grid" id="product-grid">
          <!-- Ürün kartları buraya eklenecek -->
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer>
      <div class="footer-content">
        <img
          src="assets/images/logos/logo_light.png"
          alt="TikSepet Logo"
          id="footer-logo"
          class="footer-logo"
        />
        <p>&copy; 2025 TikSepet E-Ticaret Sitesi — created by Hakan Onay</p>
      </div>
    </footer>

    <!-- Toast -->
    <div id="toast-container"></div>

    <!-- JS: global sonra sayfa script’i -->
    <script src="js/main.js"></script>
    <script type="module" src="js/products.js"></script>
  </body>
</html>
