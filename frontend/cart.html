<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikSepet | Sepet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico" />
  </head>
  <body>
    <!-- Loader -->
    <div id="loader">Yükleniyor...</div>

    <!-- Navbar -->
    <header>
      <nav class="navbar">
        <!-- Logo -->
        <a href="index.html" class="logo">
          <img
            src="assets/images/logos/logo_light.png"
            alt="TikSepet"
            id="site-logo"
          />
        </a>

        <!-- Orta Menü -->
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html">Anasayfa</a></li>
          <li><a href="products.html">Ürünler</a></li>
          <li>
            <a href="cart.html" class="active">
              🛒 Sepet <span id="cart-count" class="cart-count">0</span>
            </a>
          </li>
        </ul>

        <!-- Sağ Taraf -->
        <div class="nav-right">
          <!-- Tema butonu -->
          <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            title="Tema"
          >
            🌓
          </button>

          <!-- Hesap menüsü -->
          <div class="account-menu" id="accountMenu">
            <a href="login.html" id="loginLink">Giriş Yap</a>
            <a href="register.html" id="registerLink">Kayıt Ol</a>
            <div id="userDropdown" class="dropdown hidden">
              <button class="dropbtn">👤 Hesabım ▾</button>
              <div class="dropdown-content">
                <a href="profile.html">Profil</a>
                <a href="#" id="logoutBtn">Çıkış Yap</a>
              </div>
            </div>
          </div>

          <!-- Hamburger -->
          <div
            id="hamburger"
            class="nav-toggle"
            role="button"
            tabindex="0"
            aria-label="Menüyü aç/kapat"
          >
            <span></span><span></span><span></span>
          </div>
        </div>
      </nav>
    </header>

    <!-- Sepet İçeriği -->
    <main>
      <div class="cart-container">
        <h1 class="cart-title">Sepetim</h1>

        <div id="cart-items"><!-- Ürünler burada gösterilecek --></div>

        <div class="cart-total" id="cart-total">Toplam: ₺0,00</div>
        <div class="cart-empty" id="cart-empty" style="display: none">
          Sepetiniz boş.
        </div>

        <div class="cart-actions">
          <button id="checkout-btn" class="checkout-btn">Ödemeye Geç</button>
          <a href="products.html" class="continue-shopping">
            Alışverişe Devam Et
          </a>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <div class="footer-content">
        <img
          src="assets/images/logos/logo_light.png"
          alt="TikSepet Logo"
          id="footer-logo"
          class="footer-logo"
        />
        <p>&copy; 2025 TikSepet E-Ticaret Sitesi created by Hakan Onay</p>
      </div>
    </footer>

    <!-- Script sırası: global -> sayfa -->
    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
  </body>
</html>
